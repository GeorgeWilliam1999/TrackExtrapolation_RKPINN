# P2 (PLAN 3915d544-b9d9-81b7 v1.1) — vertex-fit corpus, endpoint-only retrain.
# =============================================================================
# Recipe = wave2_resid_h64 (residual-Huber, kick-scaled head, lambda=0) with the
# data swapped to the vertex-fit corpus (legs A/B/C/D = 55/15/15/15, 90% backward,
# per-track basin targets; generated by datagen/generate_vertexfit_v1.py + C++
# engine, 13/13 gates). select_metric = bulk median (no UT->T regime here);
# the per-leg tier-1 read-out vs the spec bars is a separate eval step.
# CPU node (no GPU): device cpu, threads capped via OMP_NUM_THREADS at launch.
# =============================================================================
seed: 42
data_path: /data/bfys/gscriven/TrackExtrapolation/experiments/vertexfit/data/vf_corpus_10M.npz
max_samples: 10000000
train_fraction: 0.8
val_fraction: 0.1

model_type: pinn_v2
hidden_dims: [96, 96]
activation: tanh
dropout: 0.0
lambda_pde: 0.0
lambda_ic: 0.0
n_collocation: 2
kick_scaled_head: true
pde_scale_mode: fixed_L
pde_ref_length: 5161.0

loss: residual_rel
resid_scale_pos: 0.05
resid_scale_slope: 2.0e-05
resid_alpha: 0.0
resid_huber_delta: 8.0
balance_sign: false
select_metric: median_dx_mm

batch_size: 4096
epochs: 80
learning_rate: 0.0007
weight_decay: 0.0001
warmup_epochs: 12
grad_clip: 1.0
patience: 40
min_delta: 1.0e-07
physics_warmup_epochs: 0

checkpoint_dir: /data/bfys/gscriven/TrackExtrapolation/experiments/vertexfit/trained_models
experiment_name: vf_zfeat_jacrow_h96
use_mlflow: false
device: cpu
num_workers: 4
pin_memory: false

# P3: Jacobian supervision (PLAN phase P3 / tier 2)
lambda_jac: 40000.0
jac_frac: 1.0
jac_every: 4
data_path_J: /data/bfys/gscriven/TrackExtrapolation/experiments/vertexfit/data/vf_corpus_10M_J.npy
jac_norm: row
z_features: true
